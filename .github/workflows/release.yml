name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version, without v (for example 0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: onlysend-manual-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tree: ${{ steps.patch.outputs.tree }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the stable branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release helpers
        run: python3 -m unittest discover -s .github -p 'test_release.py'
      - name: Prepare aligned application versions
        run: python3 .github/release.py prepare "$RELEASE_VERSION"
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.12.0
      - name: Collect accumulated changes
        run: |
          git-cliff --config .github/cliff.toml --unreleased --tag "v$RELEASE_VERSION" --output "$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            git-cliff --config .github/cliff.toml --unreleased --tag "v$RELEASE_VERSION" --prepend CHANGELOG.md
          else
            cp "$RUNNER_TEMP/notes.md" CHANGELOG.md
          fi
      - name: Record the exact source tree to build
        id: patch
        run: |
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.md
          git diff --cached --binary > "$RUNNER_TEMP/release.patch"
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: release-source
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/notes.md
          retention-days: 14

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - id: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - id: darwin-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            # The updater archive requires the app target, not only the DMG.
            bundles: app,dmg
          - id: darwin-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            # The updater archive requires the app target, not only the DMG.
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
      CARGO_PROFILE_RELEASE_PANIC: unwind
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Apply and verify the release source
        shell: bash
        env:
          RELEASE_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          git apply --index "$RUNNER_TEMP/release-source/release.patch"
          test "$(git write-tree)" = "$RELEASE_TREE"
      - name: Require public signing configuration
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PUBLIC_KEY" ] || [ -z "$PRIVATE_KEY" ]; then
            echo 'Configure TAURI_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before releasing.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Create public release configuration
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          key = os.environ["PUBLIC_KEY"].strip()
          if not key:
              raise SystemExit('Public key must contain the encoded .key.pub contents')
          config = {"bundle": {"createUpdaterArtifacts": True}, "plugins": {"updater": {"pubkey": key}}}
          (Path(os.environ["RUNNER_TEMP"]) / "release-config.json").write_text(json.dumps(config))
          PY
      - name: Install Linux runtime and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf glib-networking ca-certificates
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.id }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Build signed production bundles
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "${{ runner.temp }}/release-config.json"
      - name: Validate and stage platform installers and signatures
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PLATFORM: ${{ matrix.id }}
        run: |
          python .github/release.py stage "src-tauri/target/$RELEASE_TARGET/release/bundle" "$RUNNER_TEMP/platform-bundles" "$RELEASE_PLATFORM"
      - name: Verify AppImage includes the GIO TLS module
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image=$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$image"
          chmod +x "$image"
          image=$(realpath "$image")
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract > /dev/null
          test -n "$(find squashfs-root -name 'libgiognutls.so' -type f -print -quit)"
      - name: Upload validated platform bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.id }}-bundles
          path: ${{ runner.temp }}/platform-bundles/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [prepare, build]
    # minisign is packaged in Ubuntu 24.04, but unavailable in 22.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TREE: ${{ needs.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/artifacts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate all platforms and generate one complete updater manifest
        run: |
          python .github/release.py collect "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/release-assets" "$RELEASE_VERSION" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/artifacts/release-source/notes.md"
      - name: Verify signatures against the public key embedded in the apps
        env:
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python .github/release.py verify "$RUNNER_TEMP/release-assets"
      - name: Record release version and tag only after all builds succeed
        run: |
          git fetch origin --tags
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, '.github')
          from release import assert_newest
          assert_newest(os.environ['RELEASE_VERSION'], subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines())
          PY
          git apply --index "$RUNNER_TEMP/artifacts/release-source/release.patch"
          test "$(git write-tree)" = "$RELEASE_TREE"
          tag="v$RELEASE_VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            # Permit retrying a failed publish job, never replacing a release tag.
            test "$(git rev-parse "$tag^{tree}")" = "$RELEASE_TREE"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(release): v$RELEASE_VERSION"
            git tag "$tag"
            # No force push. If main advanced during builds, both refs are rejected.
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          fi
      - name: Upload to a draft, then publish atomically
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --verify-tag --draft --title "OnlySend $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/artifacts/release-source/notes.md"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/release-assets/"* --clobber
          gh release edit "$tag" --draft=false --latest
