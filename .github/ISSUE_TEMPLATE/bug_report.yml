name: Bug report
description: Report something that is not working in OnlySend.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. Reports are public.
        Do not include API keys, OAuth tokens, private emails, or unredacted logs/screenshots.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. See…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OnlySend version
      description: Find this in Settings → About.
      placeholder: "e.g. 0.1.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: OS version, installation format, and redacted screenshots or error messages, if relevant.
