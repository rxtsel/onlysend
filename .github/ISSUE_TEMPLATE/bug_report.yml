name: Bug report
description: Report something that is not working in OnlySend.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. Reports are public.
        Do not include API keys, OAuth tokens, private emails, or unredacted logs/screenshots.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. See…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OnlySend version
      description: Find this in Settings → About.
      placeholder: "e.g. 0.1.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version and architecture
      description: On Linux, include your distribution and desktop environment if known.
      placeholder: "e.g. Windows 11 24H2 x64; macOS 15.5 Apple Silicon; Ubuntu 24.04 x64, GNOME/Wayland"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Linux .deb
        - Linux AppImage
        - Windows installer (.exe)
        - macOS .dmg
        - Built from source / development build
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Resend connection method
      description: Select the method used by the affected account. Never share the key or token itself.
      options:
        - OAuth (Connect with Resend)
        - API key
        - Not connected yet
        - Not applicable / not sure
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once
        - Not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Error messages or screenshots
      description: Paste the exact error text or attach redacted screenshots. Remove credentials, email addresses, message contents, and other private information first.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: If relevant, mention whether this started after an update, affects one or all accounts, or happens offline or after restarting. For source builds, include the commit hash.
